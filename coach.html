.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:800 16px Heebo,system-ui;background:var(--acc);color:#fff;cursor:pointer;margin-top:6px}

.chips{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}.ch{flex:1;min-width:90px;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 15px Heebo,system-ui;cursor:pointer}.ch.sel{border-color:var(--acc);background:rgba(255,90,31,.12);color:var(--acc)}

.drops{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.dp{width:34px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer;opacity:.45}.dp.on{opacity:1;background:rgba(18,184,134,.14);border-color:var(--acc2)}

.bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none}.chk.on .bx{background:var(--acc2);border-color:var(--acc2);color:#fff;text-align:center;font-weight:900;line-height:22px}

.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}

.err{color:#e03131;font-weight:700;font-size:14px;margin:0 0 10px}
.th{display:flex;gap:10px;overflow-x:auto}.th figure{margin:0;flex:none;text-align:center;font-size:12px}.th img{width:84px;height:110px;object-fit:cover;border-radius:12px;display:block}
.stat{display:flex;gap:10px;margin-bottom:14px}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}.stat b{font-size:22px;display:block;color:var(--ink)}
.fr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.fr:last-child{border:0}.fr button{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer}
.big{font-size:40px;font-weight:900;color:var(--acc)}
.sl{display:flex;align-items:center;gap:10px;font-size:30px}.sl input{padding:0;border:0;background:none;margin:6px 0;accent-color:var(--acc)}
.hero{background:linear-gradient(135deg,#1c1f2b,#2b2f45);color:#fff;border-radius:24px;padding:16px 18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(255,90,31,.25)}
.hr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hr span{font:900 26px Heebo,system-ui;color:#ff8a3d}
.segs{display:flex;gap:6px;margin-bottom:8px}.segs i{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}.segs u{display:block;height:100%;background:linear-gradient(90deg,#ff5a1f,#ffb347);border-radius:6px;transition:width .4s;box-shadow:0 0 12px #ff8a3d}
.hero small{color:rgba(255,255,255,.65)}
.fw{background:var(--bg);border-radius:18px;padding:6px;margin:8px 0;color:var(--acc)}.fig{width:100%;height:150px;display:block}.gl{stroke:var(--line);stroke-width:2}
.tip{font-size:14px}.goal{font-weight:800;text-align:center;margin:8px 0}
.num{font:900 72px Heebo,system-ui;text-align:center;line-height:1;margin:6px 0 14px}.num small{font-size:24px;color:var(--mut)}
.tap{height:92px;font-size:26px;border-radius:26px;box-shadow:0 8px 0 #c93d0a;transition:transform .08s;margin-bottom:12px}.tap:active{transform:translateY(5px);box-shadow:0 3px 0 #c93d0a}
.ov{position:fixed;inset:0;background:rgba(10,10,15,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:100%;overflow:auto}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;margin:10px 0}.hl{position:absolute;left:15%;right:15%;top:50%;height:44px;margin-top:-22px;border-radius:12px;background:rgba(255,90,31,.16);pointer-events:none}

</style>

<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
const $=s=>document.querySelector(s),KEY="coach_v1";
let S=null,tab="home",step=0,P={g:"m",act:1.45},GAP=0,res=null,PH=null,msg="",err="",rst=0;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const dk=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dn=k=>Math.round(new Date(k+"T12:00:00")/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=()=>(S.logs[dk()]=S.logs[dk()]||{w:0,f:[],x:[]});
const LV=["מתחיל","בינוני","מתקדם"];
const T={
A:{n:"חזה, כתפיים וידיים",ex:[["שכיבות סמיכה",3,[6,12,20],"חזרות"],["דיפס על ספסל",3,[6,10,15],"חזרות"],["פייק פוש־אפ",3,[5,8,12],"חזרות"],["פלאנק",3,[20,40,60],"שניות"]]},
B:{n:"יום בטן",ex:[["כפיפות בטן",4,[12,20,30],"חזרות"],["פלאנק",3,[20,40,60],"שניות"],["מטפס הרים",3,[20,30,45],"שניות"],["גשר ישבן",3,[12,18,25],"חזרות"]]},
C:{n:"גוף מלא וקרדיו",ex:[["ג׳אמפינג ג׳ק",4,[30,45,60],"שניות"],["מטפס הרים",4,[20,30,45],"שניות"],["ברפי",3,[4,8,12],"חזרות"],["ריצה קלה או הליכה מהירה",1,[15,20,25],"דקות"]]},
D:{n:"גינת כושר: מתח וגב",ex:[["מתח (מתחילים: ירידה איטית)",4,[2,5,8],"חזרות"],["חתירה הפוכה",3,[6,10,14],"חזרות"],["הרמת ברכיים במתח",3,[6,10,14],"חזרות"],["פלאנק צד",3,[15,30,45],"שניות לכל צד"]]},
R:{n:"יום מנוחה פעילה",rest:1,ex:[]}};
const WEEK=["A","B","C","R","D","B","R"],DAYS=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const CH0=["15 שכיבות סמיכה ברצף","פלאנק דקה וחצי","30 שכיבות סמיכה ברצף","5 מתח ברצף","100 סקוואט בלי הפסקה","פלאנק 3 דקות","50 שכיבות סמיכה ברצף","10 מתח ברצף"];
const QF=[["ביצה",70],["פרוסת לחם",80],["תפוח",95],["חזה עוף (100 גרם)",165],["אורז (כוס)",205],["שייק חלבון",150],["גבינה לבנה (כף)",25]];
const wt=()=>T[WEEK[new Date().getDay()]];
function calc(p){
 const bmr=10*p.w+6.25*p.h-5*p.a+(p.g==="m"?5:-161),tdee=Math.round(bmr*p.act),fl=p.g==="m"?1500:1200,n=[],t=p.t;
 let target=tdee,goal=p.w;
 if(p.gt==="l"){target=Math.max(fl,Math.round(tdee*(1-(.08+.14*t))/10)*10);goal=Math.round((p.w-(tdee-target)*p.wk*7/7700)*10)/10;const mn=Math.ceil(19*(p.h/100)**2);if(goal<mn){goal=mn;n.push("עדכנתי את יעד המשקל כדי שיישאר בטווח בריא.")}}
 if(p.gt==="m"){const g=p.wk*(.08+.1*t);target=tdee+Math.round(g/p.wk*1100/10)*10;goal=Math.round((p.w+g)*10)/10}
 const pro=Math.round(p.w*(p.gt==="b"?1.4:1.8)),fat=Math.round(target*.27/9),carb=Math.max(0,Math.round((target-pro*4-fat*9)/4));
 return{tdee,target,goal,weeks:p.wk,water:Math.ceil(p.w*.033/.25),pro,fat,carb,n}}
function calc0(p){
 const bmr=10*p.w+6.25*p.h-5*p.a+(p.g==="m"?5:-161),tdee=Math.round(bmr*p.act),fl=p.g==="m"?1500:1200,n=[];
 let goal=p.goal;const mn=Math.ceil(18.5*(p.h/100)**2)+1;
 if(goal<mn){goal=mn;n.push("משקל היעד שהזנת נמוך מדי לגובה שלך, אז עדכנתי אותו ל־"+goal+" ק״ג.")}
 let target=tdee,weeks=0;
 if(goal<p.w){
  let def=Math.min((p.w-goal)*7700/(p.wk*7),1000,tdee*.25);
  target=Math.max(fl,Math.round((tdee-def)/10)*10);
  weeks=Math.ceil((p.w-goal)*7700/Math.max(tdee-target,100)/7);
  if(weeks>p.wk)n.push("כדי לרדת בצורה בטוחה, הקצב הריאלי הוא כ־"+weeks+" שבועות ולא "+p.wk+".")}
 return{tdee,target,goal,weeks,water:Math.ceil(p.w*.033/.25),n}}
function streak(){let n=0,d=new Date();const a=k=>{const l=S.logs[k];return l&&(l.w||l.f.length||l.x.length||l.cw)};
 if(!a(dk(d)))d.setDate(d.getDate()-1);while(a(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
const eaten=()=>L().f.reduce((a,f)=>a+f.k,0),mac=k=>L().f.reduce((a,f)=>a+(f[k]||0),0);
function SL(v){$("#slv").textContent="כ־"+v+" שבועות"}
function macros(){const c=S.c;return`<section class="card"><h2>חלבון, שומן ופחמימה</h2>${[["חלבון","p",c.pro,"#12b886"],["שומן","f",c.fat,"#f59f00"],["פחמימה","c",c.carb,"#4c6ef5"]].map(m=>{const v=Math.round(mac(m[1]));return`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${m[0]}</b><span class="mut">${v} / ${m[2]} גרם</span></div><div class="bar"><i style="width:${Math.min(100,v/m[2]*100)}%;background:${m[3]}"></i></div></div>`}).join("")}</section>`}
const RC=[
{n:"חביתת ירקות",k:280,p:18,f:20,c:6,d:"2 ביצים, פלפל, עגבנייה ותרד במחבת עם כפית שמן זית."},
{n:"סלט טונה וקטניות",k:350,p:32,f:12,c:28,d:"טונה במים, חומוס או שעועית, מלפפון, עגבנייה, לימון ושמן זית."},
{n:"חזה עוף, בטטה וברוקולי",k:480,p:45,f:10,c:48,d:"חזה עוף בתנור עם תבלינים, בטטה אפויה וברוקולי מאודה."},
{n:"שקשוקה קלה",k:300,p:17,f:18,c:16,d:"עגבניות, פלפל ו־2 ביצים במחבת, בלי לחם או עם פרוסה אחת."},
{n:"יוגורט, שיבולת שועל ופירות",k:320,p:20,f:7,c:45,d:"יוגורט חלבון, חצי כוס שיבולת שועל, פרי קצוץ וקינמון."},
{n:"מרק עדשים",k:280,p:17,f:3,c:45,d:"עדשים כתומות, גזר, בצל וכמון. מבשלים 25 דקות ומטחינים."}];
let busy=0;
async function AI0(){const txt=$("#fd").value.trim();if(!txt||busy)return;
 let sm=null;try{sm=await claude.use("sample")}catch(e){}
 if(!sm)return toast("החישוב האוטומטי לא זמין כרגע. נסה מתכון מהרשימה.");
 busy=1;render();$("#fd").value=txt;
 try{const r=await sm.json(`אתה מאמן תזונה. חשב קלוריות ומאקרו משוערים, לפי מנות ישראליות רגילות אם לא צוין אחרת, לאוכל הבא: ${txt}. החזר JSON בלבד, בלי טקסט נוסף, בפורמט: {"items":[{"n":"שם הפריט בעברית","k":קלוריות,"p":חלבון בגרם,"f":שומן בגרם,"c":פחמימה בגרם}]}`);
  const it=(r.items||[]).filter(x=>x&&x.k>0);if(!it.length)throw 0;
  it.forEach(x=>L().f.push({n:String(x.n).slice(0,60),k:Math.round(x.k),p:Math.round(x.p||0),f:Math.round(x.f||0),c:Math.round(x.c||0)}));save();toast("נוספו "+it.length+" פריטים")}
 catch(e){toast("לא הצלחתי לחשב. נסה לנסח אחרת.")}
 busy=0;render()}
function AR(i){const r=RC[i];L().f.push({n:r.n,k:r.k,p:r.p,f:r.f,c:r.c});save();toast("נוסף ליומן");render()}
function coach(){
 const l=L(),h=new Date().getHours(),t=wt(),n=esc(S.p.name),c=S.c,done=t.rest||l.x.length>=t.ex.length;
 if(GAP>1&&!l.w&&!l.f.length&&!l.x.length)return`נעלמת ל־${GAP} ימים, ${n}. אין הסברים, יש חזרה. אימון אחד היום, ואנחנו ממשיכים.`;
 if(done&&l.w>=c.water&&l.f.length)return"יום מושלם. אימון, מים ואוכל מתועדים. עכשיו לישון בזמן.";
 if(eaten()>c.target)return`עברת את היעד ב־${eaten()-c.target} קלוריות. בלי דרמה, אבל מפה עד סוף היום רק מים.`;
 if(!done&&h>=17)return`השעה ${pad(h)}:${pad(new Date().getMinutes())} והאימון עוד לא נעשה. עשרים דקות, עכשיו. אני לא זז מפה.`;
 if(h>=14&&l.w<c.water/2)return`חצי יום עבר ושתית רק ${l.w} כוסות. קום ותשתה עכשיו.`;
 if(h>=13&&!l.f.length)return"עדיין לא דיווחת על אוכל. מה שלא נרשם לא קרה, אז תרשום.";
 return h<12?`בוקר טוב ${n}. היום: ${t.n}. אין ויכוחים.`:`ממשיכים, ${n}. עוד צעד קטן להיום.`}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
let MODE='',CWF=0;function go(t){clr();if(MODE=='c'&&!CWF)MODE='';tab=t;msg="";render();window.scrollTo(0,0)}
function render(){
 if(!S||S.fresh){$("#tabs").innerHTML="";$("#app").innerHTML=S?summary():onb();return}
 $("#app").innerHTML={home,work,food,prog}[tab]()+(tab!='work'&&needSched()?ov():'');wheelInit();
 $("#tabs").innerHTML=[["home","🏠","היום"],["work","💪","אימון"],["food","🍽️","אוכל"],["prog","📈","התקדמות"]].map(x=>`<button class="${tab==x[0]?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
/* onboarding */
const inp=(id,lb,ty="number")=>`<label class="l" for="${id}">${lb}</label><input id="${id}" type="${ty}" ${ty=="number"?'inputmode="decimal"':""} value="${P[id]??""}">`;
const chips=(k,o)=>`<div class="chips">${o.map(x=>`<button class="ch ${P[k]==x[0]?"sel":""}" onclick='pc("${k}",${JSON.stringify(x[0])})'>${x[1]}</button>`).join("")}</div>`;
function grab(){document.querySelectorAll("#app input").forEach(i=>P[i.id]=i.type=="number"?(i.value===""?"":+i.value):i.value)}
function pc(k,v){grab();P[k]=v;render()}
function onb(){
